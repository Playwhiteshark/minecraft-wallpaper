name: Starter tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q full_world.py full_world
      - run: python tests/full_world_native_smoke.py
      - run: node --check web/viewer.js
      - run: node --check web/entity-models.js
      - run: node --test tests/entity_models.test.js
      # One browser-level check for real textured-mob GPU draw calls.
      # Playwright is CI-only; it is not shipped with the wallpaper.
      - if: runner.os == 'Linux'
        run: python -m pip install playwright
      - if: runner.os == 'Linux'
        run: python -m playwright install chromium
      - if: runner.os == 'Linux'
        run: python tests/webgl_mob_smoke.py
