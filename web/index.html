<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<!-- MWW-OWNED-WALLPAPER-V1: generated content lives only in scene-data.js -->
<title>Living Minecraft World</title>
<link rel="stylesheet" href="viewer.css">
<script defer src="scene-data.js"></script>
<script defer src="viewer.js"></script>
</head>
<body>
<canvas id="world" aria-label="Interactive three-dimensional Minecraft world wallpaper"></canvas>
<div id="vignette"></div>
<div id="label"><span id="world-title">Minecraft Living World</span><small id="location-title"></small></div>
<div id="controls" aria-label="Camera controls">
  <button id="left" title="Turn camera left">&#8592;</button>
  <button id="reset" title="Reset camera">&#9678;</button>
  <button id="right" title="Turn camera right">&#8594;</button>
  <button id="motion" title="Pause or resume ambient motion">&#10074;&#10074;</button>
</div>
<div id="error" role="alert" hidden></div>
</body>
</html>
